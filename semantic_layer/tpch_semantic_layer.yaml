tables:
  region:
    description: High-level geographic regions.
    primary_key: r_regionkey
    important_columns:
      - r_regionkey
      - r_name
      - r_comment
    relationships:
      - region.r_regionkey = nation.n_regionkey

  nation:
    description: Countries or nations, each belonging to one region.
    primary_key: n_nationkey
    important_columns:
      - n_nationkey
      - n_name
      - n_regionkey
      - n_comment
    relationships:
      - nation.n_regionkey = region.r_regionkey
      - nation.n_nationkey = customer.c_nationkey
      - nation.n_nationkey = supplier.s_nationkey

  supplier:
    description: Suppliers that provide parts.
    primary_key: s_suppkey
    important_columns:
      - s_suppkey
      - s_name
      - s_address
      - s_nationkey
      - s_phone
      - s_acctbal
    relationships:
      - supplier.s_nationkey = nation.n_nationkey
      - supplier.s_suppkey = partsupp.ps_suppkey
      - supplier.s_suppkey = lineitem.l_suppkey

  customer:
    description: Customers that place orders.
    primary_key: c_custkey
    important_columns:
      - c_custkey
      - c_name
      - c_address
      - c_nationkey
      - c_phone
      - c_acctbal
      - c_mktsegment
    relationships:
      - customer.c_nationkey = nation.n_nationkey
      - customer.c_custkey = orders.o_custkey

  part:
    description: Parts or products available for purchase.
    primary_key: p_partkey
    important_columns:
      - p_partkey
      - p_name
      - p_mfgr
      - p_brand
      - p_type
      - p_size
      - p_container
      - p_retailprice
    relationships:
      - part.p_partkey = partsupp.ps_partkey
      - part.p_partkey = lineitem.l_partkey

  partsupp:
    description: Many-to-many relationship between parts and suppliers, including available quantity and supply cost.
    primary_key:
      - ps_partkey
      - ps_suppkey
    important_columns:
      - ps_partkey
      - ps_suppkey
      - ps_availqty
      - ps_supplycost
    relationships:
      - partsupp.ps_partkey = part.p_partkey
      - partsupp.ps_suppkey = supplier.s_suppkey
      - partsupp.ps_partkey = lineitem.l_partkey
      - partsupp.ps_suppkey = lineitem.l_suppkey

  orders:
    description: Customer orders, including order date, status, priority, and total order price.
    primary_key: o_orderkey
    important_columns:
      - o_orderkey
      - o_custkey
      - o_orderstatus
      - o_totalprice
      - o_orderdate
      - o_orderpriority
      - o_clerk
      - o_shippriority
    relationships:
      - orders.o_custkey = customer.c_custkey
      - orders.o_orderkey = lineitem.l_orderkey

  lineitem:
    description: Individual order line items, including part, supplier, quantity, price, discount, tax, and shipping details.
    primary_key:
      - l_orderkey
      - l_linenumber
    important_columns:
      - l_orderkey
      - l_partkey
      - l_suppkey
      - l_linenumber
      - l_quantity
      - l_extendedprice
      - l_discount
      - l_tax
      - l_returnflag
      - l_linestatus
      - l_shipdate
      - l_commitdate
      - l_receiptdate
      - l_shipinstruct
      - l_shipmode
    relationships:
      - lineitem.l_orderkey = orders.o_orderkey
      - lineitem.l_partkey = part.p_partkey
      - lineitem.l_suppkey = supplier.s_suppkey
      - lineitem.l_partkey = partsupp.ps_partkey
      - lineitem.l_suppkey = partsupp.ps_suppkey

business_metric_hints:
  revenue:
    description: Revenue should usually be calculated from lineitem.
    sql: SUM(l_extendedprice * (1 - l_discount))
  customer_revenue:
    description: Customer revenue usually requires customer -> orders -> lineitem.
    join_path: customer.c_custkey = orders.o_custkey -> orders.o_orderkey = lineitem.l_orderkey
  supplier_revenue:
    description: Supplier revenue usually requires supplier -> lineitem.
    join_path: supplier.s_suppkey = lineitem.l_suppkey
  nation_analysis:
    description: Nation analysis usually joins nation to customer or supplier depending on the question.
    customer_join_path: nation.n_nationkey = customer.c_nationkey
    supplier_join_path: nation.n_nationkey = supplier.s_nationkey
  order_volume:
    description: Order volume can be counted from orders.
    sql: COUNT(*) FROM orders
  monthly_analysis:
    description: Monthly analysis should use o_orderdate from orders.
    date_column: orders.o_orderdate
