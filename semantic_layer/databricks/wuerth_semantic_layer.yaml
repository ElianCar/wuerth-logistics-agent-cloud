execution:
  target_platform: postgresql
  sql_dialect: postgresql
  schema: wuerth
  require_fully_qualified_table_names: true
  allowed_tables:
    - wuerth.invoices
    - wuerth.shipments

dataset:
  id: wuerth_local_shipment_invoice_csv_v1
  name: Würth local shipment and invoice CSV semantic layer
  description: >
    Semantic layer for the local Würth prototype data imported from CSV files into PostgreSQL.
    The local prototype uses PostgreSQL for both demo data and Würth CSV data. This layer reflects
    the actual columns currently present in database/exports/Wuerth/Wuerth_invoices.csv and
    database/exports/Wuerth/Wuerth_shipments.csv.
  source_files:
    invoices: database/exports/Wuerth/Wuerth_invoices.csv
    shipments: database/exports/Wuerth/Wuerth_shipments.csv
  source_tables:
    - wuerth.invoices
    - wuerth.shipments
  important_warning: >
    The current data does not contain a revenue, turnover, invoice amount, packing cost,
    shipment date, plant, shipping point, or statistics currency column. Do not invent
    these fields. Return an explicit limitation for questions that require missing columns.
    CRITICAL — calendar_day does NOT exist in any table. Never use calendar_day in a WHERE
    clause or SELECT. For date filtering on invoices use order_date (= Auftragsdatum) instead.
    For date filtering on shipments there is no date column available.
  process_warning: >
    Invoices and shipments do not always match one to one because invoicing and shipping can happen
    with time delays. Joins can be non-perfect and many-to-many. Aggregate each table to the requested
    business grain before joining measures from both tables.

tables:
  invoices:
    business_name: Local invoice extract
    technical_name: invoices
    fully_qualified_name: wuerth.invoices
    description: >
      Local invoice-side CSV imported into PostgreSQL. The current file contains order, customer,
      sales organization, market segment, and product/material-like identifiers, but no monetary
      revenue or turnover measure.
    grain: >
      Not confirmed. The data appears to contain multiple rows per order_number and customer.
      Do not treat order_number as unique.
    primary_business_use:
      - Invoice-side order and customer analysis
      - Invoice-side market segment and sales area grouping
      - Matching invoice-side records to shipment-side records
    columns:
      order_date:
        business_name: Order date / Auftragsdatum
        data_type: date
        semantic_type: date
        nullable: true
        description: >
          Date of the original order in the invoice extract. This is the correct column for
          filtering by date, time period, month, or year on the invoice side. There is no
          column named calendar_day, Kalendertag, shipment_date, or Lieferdatum in this table —
          always use order_date for invoice-side date filtering.
        aliases:
          - Auftragsdatum
          - Bestelldatum
          - order date
          - date
      order_reason_statistic:
        business_name: Statistical order reason
        data_type: text
        semantic_type: categorical_code
        nullable: true
        description: Coded order reason. Do not translate without a code dictionary.
      order_number:
        business_name: Order number
        data_type: text
        semantic_type: identifier
        nullable: false
        join_role: required_join_key
        aliases:
          - Auftrag
          - Auftragsnummer
      order_item:
        business_name: Order item
        data_type: text
        semantic_type: line_item_identifier
        nullable: true
        description: Order item/position identifier. Do not join this to shipments.number_delivery_items.
      sales_area:
        business_name: Sales area / Vertriebszentrum
        data_type: text
        semantic_type: organizational_code
        nullable: true
        description: >
          Organizational sales area or distribution center identifier. In Würth's German
          business context this field is referred to as Vertriebszentrum or Vertriebsgebiet.
          Use this column when the user asks about a Vertriebszentrum, distribution center,
          sales area, or sales region. Do NOT use shipments columns for this purpose.
        aliases:
          - Vertriebszentrum
          - Vertriebsgebiet
          - Verkaufsgebiet
          - distribution center
      order_entry_date:
        business_name: Order entry date
        data_type: date
        semantic_type: date
        nullable: true
      customer:
        business_name: Customer
        data_type: text
        semantic_type: customer_identifier
        nullable: false
        join_role: required_join_key
        description: >
          Invoice-side customer identifier. Project guidance maps this field to shipments.shiptoparty.
        maps_to:
          - table: shipments
            column: shiptoparty
      market_segment:
        business_name: Market segment
        data_type: text
        semantic_type: categorical_code
        nullable: true
      material_price:
        business_name: Produktnummer / Material number
        data_type: text
        semantic_type: product_identifier
        nullable: true
        join_role: required_join_key
        description: >
          Confirmed invoice-side product number (Produktnummer). Use this column when the user asks
          about Produkt, Artikel, Produktnummer, Material, or product. This is the correct join key
          to shipments.customer_material. Do NOT use a column called "product" — it does not exist.
        aliases:
          - Produkt
          - Produktnummer
          - Artikel
          - Material
          - Materialnummer
          - product
        maps_to:
          - table: shipments
            column: customer_material
      pack_size:
        business_name: Pack size
        data_type: text
        semantic_type: quantity_code
        nullable: true

  shipments:
    business_name: Local shipment extract
    technical_name: shipments
    fully_qualified_name: wuerth.shipments
    description: >
      Local shipment-side CSV imported into PostgreSQL. It contains shipment/delivery identifiers,
      delivered quantity, customer party fields, a material-like field, delivery type, and freight cost.
      The current file does not contain packing cost.
    grain: >
      Not confirmed. The data appears to contain multiple rows per order_number, shiptoparty,
      and customer_material. Do not treat order_number as unique.
    primary_business_use:
      - Shipment and delivery analysis
      - Delivered quantity analysis
      - Freight cost analysis
      - Matching shipment-side records to invoice-side records
    columns:
      order_number:
        business_name: Order number
        data_type: text
        semantic_type: identifier
        nullable: false
        join_role: required_join_key
      number_delivery_items:
        business_name: Number of delivery items
        data_type: bigint
        semantic_type: count_or_item_index
        nullable: true
        description: Do not treat as equivalent to invoices.order_item without business confirmation.
      actual_quantity_delivered_in_sales_units:
        business_name: Actual quantity delivered in sales units
        data_type: numeric
        semantic_type: measure
        nullable: true
        default_aggregation: sum
      customer_material:
        business_name: Produktnummer / Customer material number
        data_type: text
        semantic_type: product_identifier
        nullable: true
        join_role: required_join_key
        description: >
          Confirmed shipment-side product number (Produktnummer). Maps to invoices.material_price.
          Use for grouping by Produkt, Artikel, or Produktnummer on the shipment side.
        aliases:
          - Produkt
          - Produktnummer
          - Artikel
          - Material
          - Materialnummer
          - product
      priority_of_delivery:
        business_name: Delivery priority
        data_type: text
        semantic_type: categorical_code
        nullable: true
      delivery_type:
        business_name: Delivery type
        data_type: text
        semantic_type: categorical_code
        nullable: true
      shiptoparty:
        business_name: Ship to party
        data_type: text
        semantic_type: customer_identifier
        nullable: false
        join_role: required_join_key
        maps_from:
          - table: invoices
            column: customer
      soldtoparty:
        business_name: Sold to party
        data_type: text
        semantic_type: customer_identifier
        nullable: true
        description: >
          Additional shipment customer party field. The current project instruction maps invoices.customer
          to shiptoparty, not soldtoparty. Use soldtoparty only if the user explicitly asks for sold-to-party.
      delivery_number:
        business_name: Liefernummer / Delivery number
        data_type: text
        semantic_type: delivery_identifier
        nullable: true
        default_aggregation: count_distinct
        description: >
          Unique delivery identifier. Lieferpositionen (delivery positions) = COUNT(DISTINCT delivery_number).
          Always use COUNT(DISTINCT delivery_number) when the user asks for Lieferpositionen, Lieferungen,
          or number of deliveries.
        aliases:
          - Liefernummer
          - Lieferposition
          - Lieferpositionen
          - delivery position
          - deliveries
      freight_costs:
        business_name: Freight costs
        data_type: numeric
        semantic_type: monetary_measure
        nullable: true
        default_aggregation: sum

joins:
  invoices_to_shipments:
    name: invoices_to_shipments_by_order_customer_material
    status: candidate_defined_by_project_team_pending_business_confirmation
    left_table: wuerth.invoices
    right_table: wuerth.shipments
    relationship_type: many_to_many_possible
    join_condition:
      - left_column: order_number
        operator: "="
        right_column: order_number
      - left_column: customer
        operator: "="
        right_column: shiptoparty
      - left_column: material_price
        operator: "="
        right_column: customer_material
    sql_condition: >
      i.order_number = s.order_number
      AND i.customer = s.shiptoparty
      AND i.material_price = s.customer_material
    business_meaning: >
      Links invoice-side records to shipment-side records by order number, customer/ship-to-party,
      and the current material-like CSV fields.
    caveats:
      - The current invoice file does not contain a column literally named material_number.
      - The current shipment file does not contain a column literally named material_number.
      - material_price and customer_material are used as material-number candidates and require business confirmation.
      - Invoices and shipments may be delayed relative to each other and therefore may not match one to one.
    usage_rule: >
      Use this join for matching or unmatched-record questions. For combined measures, aggregate each
      side first to the requested grain before joining.

safe_query_patterns:
  invoice_record_count:
    description: Count invoice-side records without joining shipments.
    example_sql: >
      SELECT COUNT(*) AS invoice_rows
      FROM wuerth.invoices;

  shipment_freight_costs:
    description: Freight cost is available in shipments and can be summed without joining invoices.
    example_sql: >
      SELECT SUM(freight_costs) AS total_freight_costs
      FROM wuerth.shipments;

  delivered_quantity_by_delivery_type:
    description: Delivered quantity is available in shipments.
    example_sql: >
      SELECT
        delivery_type,
        SUM(actual_quantity_delivered_in_sales_units) AS delivered_quantity
      FROM wuerth.shipments
      GROUP BY delivery_type
      ORDER BY delivered_quantity DESC
      LIMIT 50;

  combined_preaggregated_join:
    description: >
      When combining invoice-side and shipment-side attributes or measures, aggregate each table first
      by order_number, customer/shiptoparty, and material candidate before joining.
    example_sql: >
      WITH invoice_agg AS (
        SELECT
          order_number,
          customer,
          material_price,
          COUNT(*) AS invoice_rows
        FROM wuerth.invoices
        GROUP BY order_number, customer, material_price
      ),
      shipment_agg AS (
        SELECT
          order_number,
          shiptoparty,
          customer_material,
          COUNT(DISTINCT delivery_number) AS deliveries,
          SUM(actual_quantity_delivered_in_sales_units) AS delivered_quantity,
          SUM(freight_costs) AS freight_costs
        FROM wuerth.shipments
        GROUP BY order_number, shiptoparty, customer_material
      )
      SELECT
        i.order_number,
        i.customer,
        i.material_price,
        i.invoice_rows,
        s.deliveries,
        s.delivered_quantity,
        s.freight_costs
      FROM invoice_agg i
      LEFT JOIN shipment_agg s
        ON i.order_number = s.order_number
       AND i.customer = s.shiptoparty
       AND i.material_price = s.customer_material
      ORDER BY i.order_number
      LIMIT 50;

kpis:
  invoice_kpis:
    invoice_row_count:
      business_name: Invoice row count
      table: wuerth.invoices
      formula_sql: COUNT(*)
      required_columns:
        - order_number

    invoice_order_count:
      business_name: Invoice order count
      table: wuerth.invoices
      formula_sql: COUNT(DISTINCT order_number)
      required_columns:
        - order_number

    revenue:
      business_name: Revenue
      status: not_supported_with_current_local_csv
      table: wuerth.invoices
      reason: >
        The current invoice CSV has no revenue, turnover, invoice amount, or currency column.
        Do not calculate revenue from material_price, because it is a text identifier-like field.

  shipment_kpis:
    delivery_count:
      business_name: Number of deliveries
      table: wuerth.shipments
      formula_sql: COUNT(DISTINCT delivery_number)
      required_columns:
        - delivery_number

    delivered_quantity:
      business_name: Delivered quantity
      table: wuerth.shipments
      formula_sql: SUM(actual_quantity_delivered_in_sales_units)
      required_columns:
        - actual_quantity_delivered_in_sales_units

    freight_costs:
      business_name: Freight costs
      table: wuerth.shipments
      formula_sql: SUM(freight_costs)
      required_columns:
        - freight_costs

    packing_costs:
      business_name: Packing costs
      status: not_supported_with_current_local_csv
      table: wuerth.shipments
      reason: The current shipment CSV has no packing cost or packaging cost column.

business_rules:
  table_selection:
    revenue_questions:
      use_table: wuerth.invoices
      rule: >
        Revenue is expected to belong to invoices, but the current local CSV does not expose a
        revenue column. Return a limitation instead of inventing a value.
    freight_questions:
      use_table: wuerth.shipments
      reason: Freight cost is available in shipments.freight_costs.
    packing_cost_questions:
      use_table: wuerth.shipments
      rule: >
        Packing cost is expected to belong to shipments, but the current local CSV does not expose
        a packing cost column. Return a limitation instead of inventing a value.
    combined_questions:
      use_tables:
        - wuerth.invoices
        - wuerth.shipments
      rule: >
        Use pre-aggregated invoice and shipment subqueries before joining. Never sum measures after
        a raw many-to-many join.

  aggregation_safety:
    avoid_raw_many_to_many_joins: true
    safe_method: >
      Pre aggregate invoices by order_number, customer and material_price. Pre aggregate shipments
      by order_number, shiptoparty and customer_material. Join those aggregates when combining both
      sides.

  unsupported_or_unconfirmed_metrics:
    revenue:
      status: missing_source_column
      reason: No revenue, turnover, invoice amount or currency column exists in the current invoice CSV.
    packing_costs:
      status: missing_source_column
      reason: No packing cost or packaging cost column exists in the current shipment CSV.
    material_number:
      status: ambiguous_source_column
      reason: >
        The project key is material number, but the current CSV columns are invoices.material_price
        and shipments.customer_material. This mapping is plausible from value overlap but requires
        business confirmation.

sql_generation_guidance:
  general:
    - Use PostgreSQL syntax.
    - Generate exactly one SELECT statement.
    - Use only wuerth.invoices and wuerth.shipments in wuerth_local mode.
    - Use explicit joins.
    - Add LIMIT 50 for broad row-level queries.
    - Do not query information_schema for business questions.
  invoice_table:
    - Use wuerth.invoices for invoice-side order, customer, market segment, sales area, order reason, and order date questions.
    - Do not use material_price as a monetary price.
    - Do not answer revenue questions with a numeric query until a real revenue column is available.
    - CRITICAL - date columns: The invoice table has order_date and order_entry_date. There is NO calendar_day, Kalendertag, shipment_date, shipping_date, or Lieferdatum column. Never generate a WHERE clause using calendar_day — always use order_date for date filtering.
    - CRITICAL - Vertriebszentrum: The sales_area column contains Vertriebszentrum / distribution center codes. Never use a shipments column for Vertriebszentrum filtering.
  shipment_table:
    - Use wuerth.shipments for delivery count, delivered quantity, delivery type, party fields, and freight cost.
    - Use SUM(freight_costs) for freight cost.
    - Do not answer packing cost questions with a numeric query until a real packing cost column is available.
  joins:
    - Join invoices to shipments on order_number, customer equals shiptoparty, and material_price equals customer_material when matching records.
    - Prefer pre aggregation when combining invoice-side and shipment-side measures.
    - Use left joins or anti joins for unmatched-record questions.
    - Never assume invoices.order_item equals shipments.number_delivery_items.
