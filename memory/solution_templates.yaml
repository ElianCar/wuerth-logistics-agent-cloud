- template_id: tmpl_tpch_q1_summed_price_report_20260512_231500_manual
  version: 1
  status: approved
  is_active: true
  created_from_candidate_id: manual_template_tpch_q1_example
  source_run_id: manual_run_tpch_q1_example
  created_at: '2026-05-12T23:15:00'
  approved_at: '2026-05-12T23:15:00'
  approved_by: manual_review
  intent: "aufsummierter Preisbericht \xFCber Auftragspositionen nach Returnflag und\
    \ Linestatus"
  trigger_phrases:
  - "aufsummierter Preisbericht \xFCber alle Auftragspositionen"
  - Preisbericht nach Returnflag und Linestatus
  - "Gesamtmenge Gesamtpreis erm\xE4\xDFigter Gesamtpreis inklusive Steuern"
  - "alle Auftragspositionen sp\xE4testens 90 Tage vor dem 1. Dezember 1998"
  - TPC-H Query 1
  - lineitem summary report
  required_tables:
  - lineitem
  metric_definitions:
    sum_qty: SUM(l_quantity)
    sum_base_price: SUM(l_extendedprice)
    sum_disc_price: SUM(l_extendedprice * (1 - l_discount))
    sum_charge: SUM(l_extendedprice * (1 - l_discount) * (1 + l_tax))
    avg_qty: AVG(l_quantity)
    avg_price: AVG(l_extendedprice)
    avg_disc: AVG(l_discount)
    count_order: COUNT(*)
  join_logic: []
  sql_skeleton: "SELECT\n    l_returnflag,\n    l_linestatus,\n    SUM(l_quantity)\
    \ AS sum_qty,\n    SUM(l_extendedprice) AS sum_base_price,\n    SUM(l_extendedprice\
    \ * (1 - l_discount)) AS sum_disc_price,\n    SUM(l_extendedprice * (1 - l_discount)\
    \ * (1 + l_tax)) AS sum_charge,\n    AVG(l_quantity) AS avg_qty,\n    AVG(l_extendedprice)\
    \ AS avg_price,\n    AVG(l_discount) AS avg_disc,\n    COUNT(*) AS count_order\n\
    FROM lineitem\nWHERE l_shipdate <= DATE '1998-12-01' - INTERVAL '90 days'\nGROUP\
    \ BY l_returnflag, l_linestatus\nORDER BY l_returnflag, l_linestatus\n"
  notes: Manual example template for TPC-H Query 1 style summed pricing report. Do
    not use this template during golden test evaluation of the same question, because
    it would leak the solution into the agent context.
