id: delivery_positions_time_series_from_plant_period
scenario: databricks
status: approved
is_active: true
title: Delivery positions time series from plant in a date period
intent: delivery_positions_time_series_from_plant_period
trigger_phrases:
  - Lieferpositionen aus Lager 9981 im Dezember 2025 im Zeitverlauf
  - Zeitverlauf Lieferpositionen Lager 9981 Dezember 2025
  - Lieferpositionen im Zeitverlauf aus Lager 9981
  - Lieferpositionen pro Tag aus Vertriebszentrum 9981
  - Tagesverlauf der Lieferpositionen für Werk 9981
  - Zeige Lieferpositionen aus Lager 9981 als Diagramm im Zeitverlauf
  - Daily delivery position count from plant 9981
  - Time series of shipment rows for one plant
searchable_summary: Count delivery positions per shipment day for a plant/Lager/Vertriebszentrum over a date period, suitable for a line or bar chart over time.
searchable_terms:
  - lieferpositionen
  - delivery_position
  - time_series
  - zeitverlauf
  - tagesverlauf
  - pro_tag
  - diagramm
  - chart
  - shipment
  - lager
  - plant
  - vertriebszentrum
  - "9981"
  - dezember
  - december
  - "2025"
  - shipment_date
synonyms:
  lieferpositionen: delivery_position
  zeitverlauf: time_series
  tagesverlauf: time_series
  pro tag: daily
  diagramm: chart
  lager: plant
  werk: plant
  vertriebszentrum: plant
required_tables:
  - workspace.default.datenabzug_projekt_tum_shipments
required_columns:
  - plant
  - shipment_date
business_rules:
  - Lieferpositionen are shipment rows; use COUNT(*) on workspace.default.datenabzug_projekt_tum_shipments.
  - Use shipment_date both for filtering and grouping.
  - Group by CAST(shipment_date AS DATE) for a daily time series unless the user asks for monthly aggregation.
  - For Lager, Werk, or Vertriebszentrum use the shipment column plant.
  - Do not join invoices for pure shipment counts.
sql_pattern: |
  SELECT CAST(shipment_date AS DATE) AS shipment_day,
         COUNT(*) AS delivery_position_count
  FROM workspace.default.datenabzug_projekt_tum_shipments
  WHERE plant = '<plant_id>'
    AND shipment_date >= DATE '<start_date>'
    AND shipment_date < DATE '<exclusive_end_date>'
  GROUP BY CAST(shipment_date AS DATE)
  ORDER BY shipment_day
do_not_use_when:
  - The user asks only for one total number and does not request a time trend, chart, Verlauf, or per-day breakdown.
  - The user asks for revenue, turnover, gross profit, or invoice-side metrics.
  - The user asks for distinct deliveries/Lieferungen instead of delivery positions/Lieferpositionen.
validation_checks:
  - SQL must be read-only SELECT.
  - SQL must use only workspace.default.datenabzug_projekt_tum_shipments for this pure shipment-count question.
  - SQL must group by CAST(shipment_date AS DATE) for daily time series output.
  - SQL must use COUNT(*) for Lieferpositionen.
source_question: Zeige mir die Lieferpositionen aus Lager 9981 im Dezember 2025 im Zeitverlauf.
source_sql: |
  SELECT CAST(shipment_date AS DATE) AS shipment_day,
         COUNT(*) AS delivery_position_count
  FROM workspace.default.datenabzug_projekt_tum_shipments
  WHERE plant = '9981'
    AND shipment_date >= DATE '2025-12-01'
    AND shipment_date < DATE '2026-01-01'
  GROUP BY CAST(shipment_date AS DATE)
  ORDER BY shipment_day
approved_by: manual_databricks_memory_seed
