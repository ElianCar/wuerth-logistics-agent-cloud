- id: q001
  question: "What is the total revenue?"
  expected_tables:
    - lineitem
  expected_sql_keywords:
    - SUM
    - l_extendedprice
    - l_discount
  expected_result_type: "single_value"
  description: "Checks whether the model can calculate basic revenue from lineitem."

- id: q002
  question: "What are the top 10 customers by revenue?"
  expected_tables:
    - customer
    - orders
    - lineitem
  expected_sql_keywords:
    - SUM
    - l_extendedprice
    - l_discount
    - ORDER BY
    - LIMIT
  expected_result_type: "ranked_table"
  description: "Checks whether the model can rank customers by revenue using the customer to orders to lineitem join path."

- id: q003
  question: "What is the revenue by nation?"
  expected_tables:
