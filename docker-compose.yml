services:
  postgres:
    image: postgres:16
    container_name: agentic_ai_postgres
    environment:
      POSTGRES_DB: agentic_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./database/exports:/docker-entrypoint-initdb.d/exports:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  wuerth_ingest:
    build: .
    container_name: agentic_ai_wuerth_ingest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATA_SCENARIO: ${DATA_SCENARIO:-demo}
      SQL_BACKEND: ${SQL_BACKEND:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: agentic_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./database/exports:/app/database/exports:ro
    command: ["python", "scripts/ingest_wuerth_csv_to_postgres.py", "--if-present"]
    restart: "no"

  app:
    build: .
    container_name: agentic_ai_streamlit
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./memory:/app/memory
      - ./evaluation:/app/evaluation
      - ./database/exports:/app/database/exports:ro
    environment:
      DATA_SCENARIO: ${DATA_SCENARIO:-demo}
      SQL_BACKEND: ${SQL_BACKEND:-postgres}
      GEMINI_ROUTER_MODEL: gemini-3.1-flash-lite
      GEMINI_EASY_MODEL: gemini-3.1-flash-lite
      GEMINI_MEDIUM_MODEL: gemini-3.1-flash-lite
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: agentic_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      PRIMARY_MODEL: llama3.2:3b
      FALLBACK_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      wuerth_ingest:
        condition: service_completed_successfully

volumes:
  postgres_data:
